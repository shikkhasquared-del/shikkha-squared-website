# Dependency policy: only install releases at least a week old, and only let the listed
# packages run install scripts.
minimumReleaseAge: 10080
minimumReleaseAgeIgnoreMissingTime: false
trustLockfile: false
strictDepBuilds: true
allowBuilds:
  esbuild: true
  fsevents: true
  sharp: true
  unrs-resolver: true
  workerd: true
storeDir: ${SITES_PNPM_SHARED_STORE:-.sites-runtime/pnpm-store}
cacheDir: ${SITES_PNPM_SHARED_STORE:-.sites-runtime/pnpm-store}/policy-cache
enableGlobalVirtualStore: false
# Reuse store files with clones or hardlinks before falling back to copies.
packageImportMethod: auto
# The explicit installer owns dependency setup, including restored workspaces.
verifyDepsBeforeRun: false
optimisticRepeatInstall: false
overrides:
  miniflare>sharp: 0.35.5
  next: 16.3.8
  react: 19.2.8
  react-dom: 19.2.8
  react-server-dom-webpack: 19.2.8
  sharp: 0.35.5
  image-size: 2.0.3
  esbuild: 0.28.1
  ws: 8.21.0
  undici: 7.29.1
  js-yaml: 4.3.2
  '@babel/core': 7.29.6
  'brace-expansion@^1': 1.1.21
  'brace-expansion@^5': 5.0.12
  browserslist: 4.28.7
  baseline-browser-mapping: 2.11.0
  'fflate@^0.7': 0.7.5
  'fast-uri@^3': 3.1.8
  source-map-js: 1.2.2
